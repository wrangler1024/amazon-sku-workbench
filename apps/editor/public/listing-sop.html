<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listing编辑字段说明</title><style>body{max-width:800px;margin:60px auto;padding:20px;font:17px/1.8 system-ui;color:#20392c}h1{font-size:28px}</style><h1>Listing编辑字段说明</h1><p>文案包括商品标题、商品亮点、五条描述、长描述及后台搜索词。按实际销售组合、规格、数量、用途和已核实限制编写，保持目标站点语言一致。</p><p>手动填写或粘贴后可直接确认；AI生成需要先确认产品资料。确认文案不会自动确认产品资料。</p><p>部署时请将 VITE_LISTING_SOP_URL 配置为团队自己的完整编辑SOP地址。</p></html>
