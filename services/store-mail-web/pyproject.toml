[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "store-mail-web"
version = "0.13.1"
description = "Xynigo 邮箱客户端：多店铺 163 邮箱聚合、风险看板与 Agent HTTP API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
dependencies = ["cryptography>=42.0"]

[project.scripts]
store-mail-web = "store_mail_web.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
store_mail_web = ["static/*", "openapi.yaml"]
