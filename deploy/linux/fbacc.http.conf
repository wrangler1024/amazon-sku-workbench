server {
    listen 80;
    server_name fbacc.samforo.icu;
    root /www/wwwroot/fbacc.samforo.icu;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type application/json;
        return 503 '{"error":{"code":"DEPLOYING","message":"HTTPS deployment in progress"}}';
    }
    access_log /www/wwwlogs/fbacc.samforo.icu.log;
    error_log /www/wwwlogs/fbacc.samforo.icu.error.log;
}
