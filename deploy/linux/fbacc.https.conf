limit_req_zone $binary_remote_addr zone=fbacc_api:10m rate=8r/s;
limit_conn_zone $binary_remote_addr zone=fbacc_connections:1m;
log_format fbacc_json escape=json '{"time":"$time_iso8601","request_id":"$upstream_http_x_request_id","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"seconds":$request_time}';

server {
    listen 80;
    server_name fbacc.samforo.icu;
    root /www/wwwroot/fbacc.samforo.icu;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://fbacc.samforo.icu$request_uri; }
    access_log /www/wwwlogs/fbacc.samforo.icu.log fbacc_json;
    error_log /www/wwwlogs/fbacc.samforo.icu.error.log;
}

server {
    listen 443 ssl http2;
    server_name fbacc.samforo.icu;
    ssl_certificate /etc/letsencrypt/live/fbacc.samforo.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fbacc.samforo.icu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FBACC_SSL:2m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 128k;
    client_body_timeout 10s;
    send_timeout 15s;
    limit_conn fbacc_connections 40;
    limit_req_status 429;
    error_page 429 = @fbacc_rate_limited;
    error_page 413 = @fbacc_too_large;
    location @fbacc_rate_limited {
        default_type application/json;
        add_header Retry-After 2 always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests; retry shortly"}}';
    }
    location @fbacc_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request body exceeds 128 KiB"}}';
    }

    gzip on;
    gzip_vary on;
    gzip_types application/json text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 1024;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    location /v1/ {
        limit_req zone=fbacc_api burst=24 nodelay;
        proxy_pass http://127.0.0.1:8791;
    }
    location / { proxy_pass http://127.0.0.1:8791; }
    access_log /www/wwwlogs/fbacc.samforo.icu.log fbacc_json;
    error_log /www/wwwlogs/fbacc.samforo.icu.error.log;
}
