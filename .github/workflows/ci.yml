name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [review, editor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/${{ matrix.app }}
      - run: npm test
        working-directory: apps/${{ matrix.app }}
      - run: npm run build
        working-directory: apps/${{ matrix.app }}
      - run: npm run test:fbacc:integration
        if: matrix.app == 'review'
  fbacc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check:fbacc
      - run: npm run test:fbacc
      - run: python -m unittest discover -s infra/rates/tests -v
        working-directory: services/amazon-fbacc
      - run: node infra/rates/verify-samples.mjs . infra/rates/samples.json
        working-directory: services/amazon-fbacc
      - run: npm run package:fbacc
      - run: docker build -t fbacc-ci services/amazon-fbacc
  mail:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/store-mail-web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked --python 3.12
      - run: uv run --locked python -m unittest discover -s tests -q
      - run: |
          for file in src/store_mail_web/static/*.js; do node --check "$file"; done
      - run: |
          uv export --frozen --no-dev --no-emit-project --no-header --format requirements.txt --output-file /tmp/mail-requirements.lock > /dev/null
          diff requirements.lock /tmp/mail-requirements.lock
      - run: uv build --out-dir dist
      - run: |
          uv venv /tmp/mail-wheel-check --python 3.12
          uv pip install --python /tmp/mail-wheel-check/bin/python --require-hashes -r requirements.lock
          uv pip install --python /tmp/mail-wheel-check/bin/python --no-deps dist/*.whl
          /tmp/mail-wheel-check/bin/python -I scripts/check_installed.py
      - run: docker build -t cloud-mail-ci .
      - run: node scripts/package-mail.mjs
        working-directory: .
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: workbench_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U workbench" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/amazon-aigc-workbench-service
    env:
      AIGC_TEST_DATABASE_URL: postgresql://workbench:disposable-ci-password@127.0.0.1:5432/workbench_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv sync --locked --python 3.12
      - run: uv run pytest -q
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_public.py
      - run: python scripts/check_versions.py
